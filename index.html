<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Engineer — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─── CSS VARIABLES ─────────────────────────────────────────── */
    :root {
      --bg:        #090c10;
      --surface:   #0d1117;
      --border:    #1e2a38;
      --accent:    #00e5ff;
      --accent2:   #ff6b35;
      --accent3:   #7fff6e;
      --text:      #cdd9e5;
      --muted:     #556473;
      --white:     #ffffff;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Syne', sans-serif;
      --radius:    6px;
      --glow:      0 0 24px rgba(0,229,255,0.18);
      --glow2:     0 0 24px rgba(255,107,53,0.18);
    }

    /* ─── RESET & BASE ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::selection { background: var(--accent); color: var(--bg); }

    /* ─── NOISE OVERLAY ─────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ─── SCROLLBAR ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    /* ─── GRID BACKGROUND ───────────────────────────────────────── */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── NAVIGATION ────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9,12,16,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .nav-logo span { color: var(--muted); }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.25s;
    }

    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }

    .nav-cta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 18px;
      text-decoration: none;
      border-radius: var(--radius);
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.06em;
    }

    .nav-cta:hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: var(--glow);
    }

    /* ─── HERO ──────────────────────────────────────────────────── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 40px 80px;
      z-index: 1;
    }

    .hero-inner {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .hero-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .hero-tag::before {
      content: '';
      display: block;
      width: 32px; height: 1px;
      background: var(--accent);
    }

    .hero-name {
      font-family: var(--font-sans);
      font-size: clamp(48px, 8vw, 100px);
      font-weight: 800;
      line-height: 0.95;
      color: var(--white);
      margin-bottom: 12px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.35s;
    }

    .hero-name .accent { color: var(--accent); }

    .hero-title {
      font-family: var(--font-mono);
      font-size: clamp(14px, 2vw, 20px);
      color: var(--muted);
      margin-bottom: 32px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.5s;
    }

    .typed-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }

    .hero-desc {
      max-width: 560px;
      font-size: 16px;
      color: var(--text);
      margin-bottom: 48px;
      line-height: 1.75;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.65s;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.8s;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 14px 28px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .btn-primary:hover {
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 14px 28px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Hero metrics strip */
    .hero-metrics {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 24px;
      opacity: 0;
      animation: fadeLeft 0.7s ease forwards 1s;
    }

    .metric {
      text-align: right;
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: 36px;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }

    .metric-value .unit { font-size: 18px; color: var(--accent); }
    .metric-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ─── SECTION SHELL ─────────────────────────────────────────── */
    section {
      position: relative;
      z-index: 1;
      padding: 100px 40px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::before { content: '//'; color: var(--muted); }

    .section-title {
      font-family: var(--font-sans);
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      color: var(--white);
      margin-bottom: 60px;
      line-height: 1.1;
    }

    /* ─── ABOUT ─────────────────────────────────────────────────── */
    #about { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .about-text p { margin-bottom: 18px; color: var(--text); font-size: 15px; line-height: 1.8; }
    .about-text p strong { color: var(--white); }

    .about-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .about-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .about-card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .fact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .fact-row:last-child { border-bottom: none; }

    .fact-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }

    .fact-value {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }

    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent3);
      box-shadow: 0 0 8px var(--accent3);
      animation: pulse 2s ease infinite;
      margin-right: 6px;
    }

    /* ─── SKILLS ────────────────────────────────────────────────── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .skill-category {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .skill-category:hover {
      border-color: var(--accent);
      box-shadow: var(--glow);
    }

    .skill-cat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .skill-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: rgba(0,229,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .skill-cat-name {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
    }

    .skill-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      background: rgba(0,229,255,0.06);
      border: 1px solid rgba(0,229,255,0.2);
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }

    .chip:hover { background: rgba(0,229,255,0.15); }

    .chip.orange {
      color: var(--accent2);
      background: rgba(255,107,53,0.06);
      border-color: rgba(255,107,53,0.2);
    }

    .chip.green {
      color: var(--accent3);
      background: rgba(127,255,110,0.06);
      border-color: rgba(127,255,110,0.2);
    }

    /* ─── EXPERIENCE ────────────────────────────────────────────── */
    #experience { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .timeline {
      position: relative;
      padding-left: 32px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, var(--accent), transparent);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 52px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -36px; top: 6px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .tl-period {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .tl-role {
      font-family: var(--font-sans);
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 4px;
    }

    .tl-company {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .tl-desc {
      font-size: 14px;
      color: var(--text);
      line-height: 1.75;
      margin-bottom: 16px;
    }

    .tl-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tl-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* ─── PROJECTS ──────────────────────────────────────────────── */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }

    .project-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,229,255,0.04), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4), var(--glow);
      border-color: rgba(0,229,255,0.4);
    }

    .project-card:hover::after { opacity: 1; }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .project-icon {
      font-size: 28px;
    }

    .project-links {
      display: flex;
      gap: 8px;
    }

    .icon-link {
      width: 30px; height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      transition: border-color 0.2s, color 0.2s;
    }

    .icon-link:hover { border-color: var(--accent); color: var(--accent); }

    .project-title {
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
    }

    .project-desc {
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      flex: 1;
    }

    .project-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stack-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255,107,53,0.08);
      color: var(--accent2);
      border: 1px solid rgba(255,107,53,0.2);
    }

    /* ─── CERTIFICATIONS ────────────────────────────────────────── */
    #certifications { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .cert-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }

    .cert-card:hover {
      border-color: var(--accent3);
      transform: translateY(-2px);
    }

    .cert-logo {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .cert-name {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }

    .cert-issuer {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .cert-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(127,255,110,0.08);
      color: var(--accent3);
      border: 1px solid rgba(127,255,110,0.25);
    }

    /* ─── CONTACT ───────────────────────────────────────────────── */
    #contact .container { text-align: center; }

    .contact-intro {
      max-width: 540px;
      margin: 0 auto 48px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.75;
    }

    .contact-form {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
    }

    .form-textarea { min-height: 130px; resize: vertical; }

    .form-submit {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .form-submit:hover {
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 48px;
    }

    .social-link {
      width: 44px; height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 18px;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }

    .social-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-3px);
    }

    /* ─── FOOTER ────────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px 40px;
      border-top: 1px solid var(--border);
    }

    .footer-text {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .footer-text span { color: var(--accent); }

    /* ─── TOAST ─────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px; right: 32px;
      background: var(--surface);
      border: 1px solid var(--accent3);
      border-radius: 8px;
      padding: 14px 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent3);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ─── ANIMATIONS ────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeLeft {
      from { opacity: 0; transform: translate(24px, -50%); }
      to   { opacity: 1; transform: translate(0, -50%); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes pulse {
